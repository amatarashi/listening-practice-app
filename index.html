<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5efe5">
  <meta name="description" content="Тренировки английского аудирования для уровней A1–B1.">
  <title>Аудирование</title>
  <link rel="stylesheet" href="./style.css?v=6">
  <script id="telegram-sdk" async src="https://telegram.org/js/telegram-web-app.js"></script>
  <script type="module" src="./app.js?v=6"></script>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <button type="button" class="header-mark" data-action="home" aria-label="На главную">
        <span class="headphones" aria-hidden="true"></span>
      </button>
      <span class="wordmark">АУДИРОВАНИЕ</span>
      <button type="button" class="points" data-action="progress" aria-label="Открыть прогресс">
        <span aria-hidden="true">✧</span> <span id="points">0 XP</span>
      </button>
    </header>
    <main id="screen"></main>
    <nav class="tabbar" aria-label="Разделы">
      <button type="button" data-action="home"><span aria-hidden="true">⌂</span>Главная</button>
      <button type="button" data-action="lessons"><span class="headphones" aria-hidden="true"></span>Практика</button>
      <button type="button" data-action="progress"><span aria-hidden="true">✧</span>Прогресс</button>
    </nav>
  </div>
  <audio id="recording" preload="metadata"></audio>
  <noscript>Для тренировки включите JavaScript.</noscript>
</body>
</html>
